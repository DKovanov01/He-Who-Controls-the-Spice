building_zro_arrakeen_palace: "Arrakeen Palace"
building_zro_arrakeen_palace_desc: "The single most colossal structure on Dune, this palace is the symbol of power in the galaxy - the place where only the richest beings would reside in and rule from."

building_arrakeen_capital: "Arrakeen"
building_arrakeen_capital_desc: "The capital city of Arrakis, surrounded by a shield wall that keeps it safe from storms and sandworms."

