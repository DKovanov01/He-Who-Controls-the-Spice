# DECISIONS

decision_planet_luxuries_boost_zro:0 "Provide Spice"
decision_planet_luxuries_boost_zro_desc:0 "People in our empire are addicted to Spice, without it they feel increasing discomfort and maybe even death.\n\nCompletely §GNegates§! the §YHappiness§! §RPenalty§! and possibility of §Rdeath§! for §YSpice-addicted pops§!."
planet_luxuries_boost_zro:0 "Spice Needs Fullfilled"
planet_luxuries_boost_zro_desc:0 "People in our empire are addicted to Spice, without it they feel increasing discomfort and maybe even death.\n\nCompletely §GNegates§! the §YHappiness§! §RPenalty§! and possibility of §Rdeath§! for §YSpice-addicted pops!§!."
