tech_zro_navigator_1: "Spice Navigator"
tech_zro_navigator_1_desc: "The consumption of Spice has given certain individuals the ability to glimpse the future. Some individuals have managed to use that ability to see safe hyperspace routes, making ship navigation easier and faster."
TECH_UNLOCK_ZRO_NAVIGATOR_1: "Spice Navigator"

