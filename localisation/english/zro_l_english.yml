TECH_UNLOCK_ZRO_NAVIGATOR_1_DESC: "The consumption of Spice has given certain individuals the ability to glimpse the future. Some individuals have managed to use that ability to see safe hyperspace routes, making ship navigation easier and faster."

tech_zro_navigator_2: "Spice Navigator: Stage 2"
tech_zro_navigator_2_desc: "Consistent consumption of large quantities of the Spice has mutated the Navigators, but has also greatly enhanced their abilities, making them capable of folding space and allowing ships to move across the galaxy in mere days."
TECH_UNLOCK_ZRO_NAVIGATOR_2: "Spice Navigator: Stage 2"

TECH_UNLOCK_ZRO_NAVIGATOR_2_TITLE: "Unlocks a §HStage 2 Navigator§! as a ship component."

TECH_UNLOCK_ZRO_NAVIGATOR_2_DESC: "Consistent consumption of large quantities of Spice has mutated the Navigators, but has also greatly enhanced their abilities, making them capable of folding space and allowing ships to move across great distances in mere days."

tech_zro_navigator_3: "Spice Navigator: Stage 3"
tech_zro_navigator_3_desc: "Consistently immersed in Spice, these navigators have fully mutated and resemble nothing of their original species. Their abilities allow them to easily find the fastest route, as well as fold space to move their ships across the entire galaxy."
