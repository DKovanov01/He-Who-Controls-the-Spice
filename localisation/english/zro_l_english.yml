planet_zro_worm_terraforming:0 "Sandtrout Terraforming"
planet_zro_worm_terraforming_desc:0 "With our material support, we let Sandtrouts terraform this planet into a Desert World.\n\n§YTerraforms§! This world into a §GDesert World§! in §Y5§! Years, with a §YUnique Planetary Feature§!."
decision_sandtrout_planting_terraform:0 "Begin Sandtrout Terraforming"
decision_sandtrout_planting_terraform_desc:0 "With our revelation of the capabilities of the Sandworm's offspring, we are able to use the so called Sandtrout to cover terraformable planets with sand, turning them into a Desert world."
zro_worm.terraform_tooltip:0 "§YTerraforms§! This world into a §GDesert World§! in §Y5§! Years, with a §YUnique Planetary Feature§!."

planet_great_sandworm_terraforming:0 "Great Sandworm Terraforming"
planet_great_sandworm.terraforming_tooltip: "With our material support, we let the Sandworm terraform this planet into a Desert World.\n\n§YTerraforms§! This world into a §GDesert World§! in §Y5§! Years, with a §YUnique Planetary Feature§! that allows productoin of §HSpice§!."
zro_great_sandworm.terraform_tooltip:0 "§YTerraforms§! This world into a §GDesert World§! in §Y5§! Years, with a §YUnique Planetary Feature§! that allows productoin of §HSpice§!."

d_zro_worm_colony:0 "Sandtrout Desert"
d_zro_worm_colony_desc:0 "A section of this planet is used to grow Sandworm's offspring, these Sandtrouts will grow into Sandworm's after millenias. But for now they have fullfilled our terraforming needs."

d_zro_great_sandworm:0 "Sandworm Desert"
d_zro_great_sandworm_desc:0 "A section of this planet has been terraformed into an environment similar to that of Arrakis. It is now an environment suitable for the creation and harvesting of Spice."


#great_sandworm_terraforming
decision_great_sandworm_terraform:0 "Great Sandworm Desert"
decision_great_sandworm_terraform_desc:0 "A section of this planet will been terraformed by the Great Sandworm and is now a similar environment to that of Arrakis. As such, it now has favorable conditions for the creation and harvesting of Spice."

