# RESOURCE
sr_zro:0 "Spice"
sr_zro_desc:0 "An extremely rare aerosol of exotic particles. It has been deposited on a number of worlds through meteor impacts, but its true origin is a mystery. If ingested by psionically-gifted individuals, Spice acts as a very potent (and addictive) drug that enhances PSI abilities."

# TRAITS

trait_desertic:0 "Fremen"
trait_desertic_desc:0 "§LThis species has originated on a Desert World that is full of great dangers and happenes to be the biggest source of Spice in the galaxy. The environment along with their culture and customs have turned the natives into the best warriors and survivors in the galaxy, and their constant consumption and reliance on Spice grants them great health benefits."
trait_desertic_tooltip:1 "£consumer_goods£ Pop Consumer Goods Upkeep on §YDesert§! worlds: §G-30%§!\n£unity£Unity production from £job£Jobs on §Ydesert§! worlds: §G+15%§!\n£consumer_goods£ Pop Consumer Goods Upkeep on non-§YDry§! worlds: §R+30%§!\nWorker Pop output on non-§YDry§! worlds: §R-10%§!\nHabitability on non-§YDry§! worlds §R-20%§!\n\n§YHappiness§!, §YUnity§! and §YGrowth§! §RPenalty§! can be §GNegated§! through a planetary decision that requires £sr_zro£ Spice, as well as through the construction of §YSpice Dispensaries§!.":

trait_zroic:0 "Accustomed to Spice"
trait_zroic_desc:0 "The individuals of this species has taken well to consumption of Spice, and thus are benefiting from it. However, they suffer from withdrawal should they not have a constant supply of Spice. §YHappiness§!, §YUnity§! and §YGrowth§! §RPenalty§! can be §GNegated§! through the construction of §YSpice Dispensaries§!."
trait_zroic_tooltip:1 ""

trait_zroadd:0 "Addicted to Spice"
trait_zroadd_desc:0 "The individuals of this species has become helplessly addicted to Spice. While they feel certain benefits, the need to consume the substance has started affecting their everyday life in a negative way. They suffer from severe withdrawal should they not have a constant supply of Spice. §YHappiness§!, §YUnity§! and §YGrowth§! §RPenalty§! can be §GNegated§! through the construction of §YSpice Dispensaries§!."
trait_zroadd_tooltip:1 ""

# ORIGIN

d_zro_worm_home:0 "The Great Sandworm"
d_zro_worm_home_desc:0 "The dunes of this planet are inhabited by giant Sandworms. Worshipped by the local population, they attack and consume everything in their path."

origin_zro_worm:0 "Children of the Dunes"
origin_zro_worm_desc:0 "For generations this species has lived on the world they've come to call Dune, a dangerous Desert World full of massive Sandworms. Learning to survive and co-exist with the creatures, the Fremen have managed to harvest Spice - a mysterious substance that prolongs life, grants enormous health benefits and powerful psionic abilities." 
START_SCREEN_ZRO_WORM:1 "We [GetSpeciesName] have come to call the dunes of [GetHomeWorldName] our home. For thousands of years we have co-existed with the Sandworms that inhabit the desert, as we learned to harness the power Spice - these holy creatures' greatest gift.\n\n After millenia of fighting the fellow tribes of our homeworld, we have finally united under a single great leader who has promised us the stars. The time has come to conquer the universe. $START_SCREEN_ZRO_WORM_END$":

zro_worm_start_NAME:0 "Sandworm System"
zro_worm_start_DESC:0 "The starting system of Children of the Dunes Origin."
origin_zro_worm_effects:0 "- Start with §HThe Great Sandworm§! as a planetary feature on your homeworld, providing Jobs that produce £sr_zro£ Spice.\n- Main Species gain §HFremen§! Trait. Lowering happiness, increasing production on §YDesert§! planets and decreasing production on non-§YDry§! planets.\n- Unique Leader Traits and early Psionic Techs."

# BUILDINGS

tech_building_zro_dispensery: "Spice Dispensery"
tech_building_zro_dispensery_desc: "Allows the construction of a Spice Dispensery - a building that would give the population of a planet easy access to Spice Melange."
tech_building_zro_dispensery_tooltip: ""

tech_building_zro_harvester_depot: "Spice Harvester Depot"
tech_building_zro_harvester_depot_desc: "Allows the construction of a Spice Harvester Depot, which would send out harvesters to collect the Spice on Arrakis-like worlds."
tech_building_zro_harvester_depot_tooltip: ""

building_zro_harvester_depot:0 "Spice Harvester Depot"
building_zro_harvester_depot_desc:0 "Houses a single harvester that goes out into the desert to mine Spice"
zro_harvester_depot_effect_desc:0 "Deploys harvesters into the deep desert to harvest §HSpice§!. Harvesters require §YAlloys§! for upkeep."

building_zro_dispensery:0 "Spice Dispensery"
building_zro_dispensery_desc:0 "Enscrybed by myths and tales of the Great Sandworm, this bureacratic building provides the population with much needed Spice, which is required for some people to sustain a healthy life, in conjuction grows small farms of Sandtrout to study and showcase."
zro_dispensery_effect_desc:0 "Provides §HSpice§! to the population, §GNegating§! the §YHappiness§!, §YProduction§! and §YGrowth§! penalties."

building_zro_smugglers_legit:0 "Allied Spice Smugglers"
