 specialist.1260.title:0 "Spice Remains"
 specialist.1260.desc:0 "[prospectorium_discovery_target.ResourceDiscovery]\n\n[prospectorium_discovery_target.ResourceDiscoveryZro]"

 # Second Half - Spice
 ResourceDiscoveryZro1:0 "As we continued to follow it, we found a source of Spice buried deep below the surface. Exotic harvesting tools littered the chamber floor, and with a little ingenuity we should be able to make use of them ourselves."
 ResourceDiscoveryZro2:0 "It is connected to a defunct facility hidden in the depths below. The facility itself appears intended to survey a Spice impact site. Though empty and largely offline, it should eventually be possible to reuse it for our own purposes."

