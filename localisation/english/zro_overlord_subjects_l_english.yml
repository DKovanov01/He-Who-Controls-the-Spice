 holding_ducal_castle: "Duke's Keep"
 holding_ducal_castle_desc: "Allowing an honorable Duke to oversee this fief will improve our relations with the local population."
 holding_ducal_castle_armies_desc: "Every Overlord army on this planet gives an additional §G-5%§! [Root.CrimeOrDeviancy], §G+0.5§! $r_loyalty$ and §G+5%§! Happiness, to a maximum of §G-30%§! [Root.CrimeOrDeviancy], (an additional) §G+2§! $r_loyalty$ and §G+20%§! Happiness."

 holding_barons_palace: "Baron's Stronghold"
 holding_barons_palace_desc: "A despotic Baron ruling this world with an iron fist will surely put the locals in their place..."
 holding_barons_palace_armies_desc: "Every Overlord army on this planet gives an additional §G-10%§! [Root.CrimeOrDeviancy], §R-0.5§! $r_loyalty$, §R-10%§! Happiness and §G+1§! §YOverlord's Spice Harvester§!, to a maximum of §G-50%§! [Root.CrimeOrDeviancy], (an additional) §R-2§! $r_loyalty$, §R-40%§! Happiness and §G3§! §YHarvesters§!."

 holding_allied_sietch: "Allied Sietch"
 holding_allied_sietch_desc: "Building an alliance with a local Sietch will win us local people's support, and grant us access to their resources. An allied sietch is an allied Arrakis."

 holding_zro_requisitorium: "Ministry of Spice Production"
 holding_zro_requisitorium_desc: "If the rulers of this planet won't give us our fair share of Spice, locals should be made to do so instead. My spice, my Arrakis... my Dune.""
  
 job_zro_requisitioned_effect_desc: "£job_underscore_zro_harvester£ Harvesters produce §R-1§! $sr_zro$ for the Subject and §G1§! $sr_zro$ for the Overlord."

