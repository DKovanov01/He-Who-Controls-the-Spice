resolution_spacing_guild_establishment: "Establish the Spacing Guild"
resolution_spacing_guild_establishment_tooltip: "Establis the Spacing Guild to assist with interstellar travel."
resolution_spacing_guild_establishment_desc: "In exchange for discouraging advancments of AI and robotics technology, the §YSpacing Guild§! has agreed to provide the Galactic Community members with resources and technology necessary to sustain their §HGuild Navigators§! and improve ship designs for better and faster navigation among the stars."

resolution_spacing_guild_fees: "Spacing Guild Fees"
resolution_spacing_guild_fees_tooltip: "Provide the Spacing Guild its requested fee."
resolution_spacing_guild_fees_desc: "The §YSpacing Guild§! is willing to provide greater assistance in interstellar travel in exchange for an established fee for their services."

resolution_space_travel_monopolization: "Monopolize Space Travel"
resolution_space_travel_monopolization_tooltip: "Allow the Spacing Guild a monopoly on interstellar travel."
resolution_space_travel_monopolization_desc: "The §YSpacing Guild§! wishes to establish itself as the main provider of interstellar travel services exchange for improvements to §HSpice§! industry and overall production."

resolution_spice_industry_monopolization: "Monopolize Spice Production"
resolution_spice_industry_monopolization_tooltip: "Monopolize Spice production to secure the Spacing Guild's position and services."
resolution_spice_industry_monopolization_desc: "Having established itself as the main provider of interstellar travel, the §YSpacing Guild§! now wishes to establish fees on production of §HSpice§! to better secure its position."

resolution_full_spice_industry_monopoly: "Complete Spice Monopoly"
resolution_full_spice_industry_monopoly_tooltip: "Empires in control of §YArrakis§! or similar worlds used for the production of §HSpice§! will have the §Rnegative§! spice production of the previous resolution reversed to §Gpositive§!, as well as gain 1 £influence£ in place of increased crime.\n\n"
resolution_full_spice_industry_monopoly_desc: "In exchange to §YSpacing Guild§! remaining in power, Empires in control of §HSpice§! production will re-negotiate and negate their §RSpice tax§! to ensure their sovereignty."

