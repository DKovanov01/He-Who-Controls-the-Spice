 tech_mine_zro:0 "Spice Distillation"
 tech_mine_zro_desc:3 "An extremely rare aerosol of exotic particles. It has been deposited on a number of worlds through meteor impacts, but its true origin is a mystery. If ingested by psionically-gifted individuals, Spice acts as a very potent (and addictive) drug that enhances Psi abilities."
