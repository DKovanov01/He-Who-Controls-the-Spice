 ancrel.7006.name:0 "Psionic Guidance"
 ancrel.7006.1.desc:1 "As we touch the Soulstone, we are projected in to a microcosm of the Shroud. We become aware that we are not alone in this swirling twilight realm. There is an entity awaiting us, one immeasurably ancient. A keeper of secrets. $relic_zro_entity_name$, we instinctively know.\n\nHaving passed the test of making contact with it, the entity awaits our questions."
 ancrel.7006.2.desc:1 "The Soulstone, pulsing with inner light, seems to wordlessly beckon. We touch it, and our minds are drawn in to a pocket dimension of the Shroud, where the enigmatic entity called $relic_zro_entity_name$ awaits.\n\nIt knows things no mortal being could know, and seems willing to share its secrets now that we have reached its sanctum."
 ancrel.7006.3.desc:1 "Something awaits us inside the Soulstone. $relic_zro_entity_name$. It's been waiting for us since before we were alive.\n\nTouching the stone ushers us in to the intangible place where it dwells. Alone for ages with only its own thoughts for company, the entity seems eager to answer our questions using all its arcane wisdom, although whether it does this to help, or for mere sport, is a mystery."
 ancrel.7006.a:0 "Ask $relic_zro_entity_name$ to share an insight"
 ancrel.7006.b:0 "Ask $relic_zro_entity_name$ about matters martial"
 ancrel.7006.c:0 "Ask $relic_zro_entity_name$ about matters of state"
 ancrel.7007.name:0 "$r_galaxy$"
 ancrel.7007.desc:1 "Time flows faster inside the miniature galaxy, and by carefully observing its denizens we are able to learn much when comes to advanced technologies."

 d_hab_zro_1:0 "Spice Deposit"
 d_hab_zro_1_desc:0 "This habitat is built near an exploitable Spice deposit."
