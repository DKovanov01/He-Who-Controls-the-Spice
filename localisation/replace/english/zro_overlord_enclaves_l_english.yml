 enclave_mercenary_station:0 "Spacing Guild Starbase"
 enclave_mercenary_station_plural:0 "Spacing Guild Starbases"
 enclave_mercenary_starbase_ruined:0 "Ruined Spacing Guild Starbase"
 enclave_mercenary_starbase_ruined_desc:0 "This once-proud fortress of Spacing Guild commerce has fallen to ruin; its showrooms have been looted of all their pitiless treasures."

 mercenary_army:0 "Spacing Guild Army"
 mercenary_army_desc:0 "These troops are in it for the money. They are ruthless and efficient, but while risk is part of the job, they are unwilling to sacrifice themselves for a cause. And will never pass on a chance to pillage."
 mecha_army:0 "Mechanized Spacing Guild Army"
 mecha_army_desc:0 "The best mercenaries on the market. These troops make up for their low numbers by piloting huge walking machines. Although they are not the bravest soldiers, they are merciless, and leave only smoldering ruins in their wake."

 #Situations
 mercenary_dividends:0 "Spacing Guild Dividends"
 mercenary_dividends_type:1 "$mercenary_dividends$"
 mercenary_dividends_desc:0 "This enclave is accumulating tribute for their patron."
 mercenary_dividends_monthly_change_tooltip:0 "$situation_monthly_change_tooltip_no_control$"
 high_level:0 "I"
 lord_of_war:0 "Lord of War"

 enclave.2000.name:0 "Spacing Guild Enclave Pays Dividends"
 enclave.2000.desc:1 "Esteemed Patron, our recent contracts have been fruitful. We have expanded our civilian operations, and several corporations have hired us for a variety of security and peacekeeping services. While on contract, our operatives chanced upon some valuable scientific research. You will find it attached along with your regular dividends."
 enclave.2005.desc:1 "Esteemed Patron, the company is doing well, and our earnings are steadily increasing. Here are your dividends, along with an extra delivery of resources we recovered from a civilian client who defaulted on their payment."
 enclave.2010.desc:1 "Esteemed Patron, we are pleased to announce record profits during this fiscal interval! As such, we have included a generous bonus to your regular dividends."
 enclave.2015.desc:1 "Esteemed Patron, our shipyards have been working tirelessly to produce the very best fleet possible. In addition to your dividends, we are pleased to offer you a complimentary fleet of our latest designs for you to review and test out. Let us know what you think of them!"
 enclave.2020.desc:1 "Esteemed Patron, our latest peacekeeping operation had us dismantle several pirate operations and we recovered an extraordinary amount of resources, technological data and ships. Most of these have been set apart for you, in addition to your well-earned dividends."
 enclave.2025.desc:1 "Esteemed Patron, the company is going through difficult times. We lost several civilian clients, and various of our other operations ended in costly failures. We are setting up a restructuring plan that will cut expenditures across the board, and we will be letting some of our staff go.\n\nRest assured that we worked tirelessly to bring you your dividends, and that this misfortune is only temporary."
 enclave.2025.a:0 "Disappointing."
 enclave.2025.b:0 "You're fired. See the Board about your severance package."
 enclave.2025.c:0 "Let us help instead."
 enclave.2040.desc:0 "You want to share your technology? Your trust in us is an honor, dear patron. While our R&D department is committed to keeping us on the bleeding edge of research, we simply cannot mobilize the same amount of resources as you. And any knowledge that you share with us will be used to develop our activities in the most ethical manner!"
 enclave.2040.a.tt:0 "We will share our §Ytechnology§! with this enclave. This can only be done once every §Y10 years§!."
 
 resolution_defenseprivatization_defense_contracts_tooltip:1 "Every §YSpacing Guild Enclave§! gains §G+10§! Naval Capacity.\n§YSpacing Guild Dividends§! are more frequent.\nHired §YSpacing Guild Fleets§! take up §G5%§! less Naval Capacity but have §R+10%§! Energy Upkeep."
 resolution_defenseprivatization_private_support_troops_tooltip:1 "Every §YSpacing Guild Enclave§! gains §G+20§! Naval Capacity.\n§YSpacing Guild Dividends§! are more frequent.\nHired §YSpacing Guild Fleets§! take up §G10%§! less Naval Capacity but have §R+20%§! Energy Upkeep."
 resolution_defenseprivatization_condottieri_tooltip:1 "Every §YSpacing Guild Enclave§! gains §G+30§! Naval Capacity.\n§YSpacing Guild Dividends§! are more frequent.\nHired §YSpacing Guild Fleets§! take up §G15%§! less Naval Capacity but have §R+30%§! Energy Upkeep.\n\n$resolution_defenseprivatization_breach$"
 resolution_defenseprivatization_security_business_tooltip:1 "Every §YSpacing Guild Enclave§! gains §G+40§! Naval Capacity.\n§YSpacing Guild Dividends§! are more frequent.\nHired §YSpacing Guild Fleets§! take up §G20%§! less Naval Capacity but have §R+40%§! Energy Upkeep.\n§G+20%§! £diplo_weight£ §YDiplomatic Weight§! while a §YSpacing Guild Fleet§! is hired.\n\n$resolution_defenseprivatization_breach$"
 resolution_defenseprivatization_corporate_warlords_tooltip:1 "Every §YSpacing Guild Enclave§! gains §G+50§! Naval Capacity.\n§YSpacing Guild Dividends§! are more frequent.\nHired §YSpacing Guild Fleets§! take up §G25%§! less Naval Capacity but have §R+50%§! Energy Upkeep.\n§G+40%§! £diplo_weight£ §YDiplomatic Weight§! while a §YSpacing Guild Fleet§! is hired.\n\n§YHaving no hired Spacing Guild§! is §Rbanned§!."

 resolution_defenseprivatization_breach:0 "§YBeing at war without any hired Spacing Guild fleets§! is §Rbanned§!."

